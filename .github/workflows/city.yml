# Rebuild the city geometry from OpenStreetMap + AWS Terrain Tiles.
# Overpass is tried first, within a time budget; the tile cache is kept
# between runs so the fetch resumes where it stopped. If the cache is still
# incomplete, the build falls back to BBBike's regional .osm.pbf extract.
# Run by hand, or quarterly.
name: City geometry

on:
  workflow_dispatch:
  schedule:
    - cron: "41 4 2 1,4,7,10 *"

permissions:
  contents: write

concurrency:
  group: city-geometry
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Restore OSM and DEM cache
        uses: actions/cache@v4
        with:
          path: |
            .cache/osm/all
            .cache/dem
          key: city-cache-${{ github.run_id }}
          restore-keys: city-cache-

      - name: Fetch OpenStreetMap (Overpass, up to 3 h)
        run: timeout 3h npm run city:fetch || echo "Overpass incomplete; the build will use the PBF extract"

      - name: Build assets
        run: npm run city:build

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/city
          if git diff --cached --quiet; then echo "No change"; exit 0; fi
          git commit -m "data: rebuild city geometry from OpenStreetMap"
          git push
