# Daily: compare every yearly BIXI trip-history zip on the open-data page with
# what the site was built from, and only for new or changed years download the
# zip here (cdn.bixi.com blocks browsers, and Vercel functions must never process
# it), rebuild that year's archive entry (and the story day for the newest
# year), then commit. The push to main triggers a Vercel deploy.
name: History data

on:
  schedule:
    - cron: "23 9 * * *"
  workflow_dispatch:
    inputs:
      force_year:
        description: Rebuild this year even if its zip did not change (e.g. 2026)
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: history-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Update changed years
        run: npm run history:update -- ${{ inputs.force_year && format('--force-year {0}', inputs.force_year) || '' }}

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data
          if git diff --cached --quiet; then echo "No data change"; exit 0; fi
          git commit -m "data: refresh BIXI trip history"
          git push
